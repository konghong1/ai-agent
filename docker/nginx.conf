server {
    listen 80;
    server_name localhost;

    # Allow large request bodies (reference images are sent as base64 in the
    # chat request body). Default nginx limit is 1m which triggers
    # "413 Request Entity Too Large" when attaching local images.
    client_max_body_size 50m;

    # Gzip for static assets
    gzip on;
    gzip_types text/css application/javascript image/svg+xml;
    gzip_min_length 1000;

    # ── Cache strategy ──
    # Hashed assets (index-XXXX.js / XXXX.css) are content-addressed and safe
    # to cache forever (immutable). The HTML entry MUST NOT be cached: a stale
    # index.html keeps referencing a deleted hashed bundle after a rebuild,
    # which returns 404 and breaks the whole SPA (page content "disappears").
    location /assets/ {
        root /usr/share/nginx/html;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Entry HTML — never cache (exact match so the header is always applied,
    # even through try_files internal redirects).
    location = /index.html {
        root /usr/share/nginx/html;
        add_header Cache-Control "no-cache";
    }

    # Serve React static files
    location / {
        root /usr/share/nginx/html;
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }

    # Proxy API requests
    location /api/ {
        proxy_pass http://api:8010/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # SSE support
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 86400s;
    }

    # Direct media access from MinIO
    location /media-assets/ {
        proxy_pass http://minio:9000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Health check
    location /health {
        proxy_pass http://api:8010/health;
    }
}
