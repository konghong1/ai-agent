version: '3.8'

services:
  # ── Database ───────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: ai-agent-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ai_agent
      POSTGRES_USER: ai_agent
      POSTGRES_PASSWORD: ${DB_PASSWORD:-ai_agent_secure_2026}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ai_agent"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Object Storage (MinIO / RustFS-compatible) ─────────────
  minio:
    image: minio/minio:latest
    container_name: ai-agent-minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minioadmin}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Init MinIO bucket (runs once at startup) ───────────────
  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin;
      mc mb local/media-assets --ignore-existing;
      mc anonymous set public local/media-assets;
      exit 0;
      "

  # ── Backend API ────────────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    container_name: ai-agent-api
    restart: unless-stopped
    ports:
      - "${API_PORT:-8010}:8010"
    environment:
      # Database
      DATABASE_URL: postgresql+asyncpg://ai_agent:${DB_PASSWORD:-ai_agent_secure_2026}@postgres:5432/ai_agent
      # Storage
      STORAGE_BACKEND: ${STORAGE_BACKEND:-minio}
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-minioadmin}
      MINIO_BUCKET: ${MINIO_BUCKET:-media-assets}
      MINIO_PUBLIC_URL: ${MINIO_PUBLIC_URL:-http://localhost:9000/media-assets}
      MINIO_USE_SSL: "false"
      # Agnes AI API
      AGNES_API_KEY: ${AGNES_API_KEY:-sk-0T1BpcsI51cKxXgWZejpvONrcUs8vDc1Tqzz7NkObIWAyezd}
      AGNES_BASE_URL: ${AGNES_BASE_URL:-https://apihub.agnes-ai.com/v1}
      # App
      SECRET_KEY: ${SECRET_KEY:-change-me-in-production}
      DEBUG: "false"
      CORS_ORIGINS: "${CORS_ORIGINS:-http://localhost:5173,http://localhost:3000}"
    depends_on:
      postgres:
        condition: service_started
      minio:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    volumes:
      - ./:/app
    command: uvicorn app.server:app --host 0.0.0.0 --port 8010 --reload

  # ── Background Worker (downloads media from CDN to MinIO) ──
  worker:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    container_name: ai-agent-worker
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+asyncpg://ai_agent:${DB_PASSWORD:-ai_agent_secure_2026}@postgres:5432/ai_agent
      STORAGE_BACKEND: ${STORAGE_BACKEND:-minio}
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-minioadmin}
      MINIO_BUCKET: ${MINIO_BUCKET:-media-assets}
      MINIO_PUBLIC_URL: ${MINIO_PUBLIC_URL:-http://localhost:9000/media-assets}
      MINIO_USE_SSL: "false"
      AGNES_API_KEY: ${AGNES_API_KEY:-sk-0T1BpcsI51cKxXgWZejpvONrcUs8vDc1Tqzz7NkObIWAyezd}
      AGNES_BASE_URL: ${AGNES_BASE_URL:-https://apihub.agnes-ai.com/v1}
      SECRET_KEY: ${SECRET_KEY:-change-me-in-production}
    depends_on:
      postgres:
        condition: service_started
      minio:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    volumes:
      - ./:/app
    command: python -m app.worker.media_worker

  # ── Frontend (Nginx serves static React app) ───────────────
  web:
    image: nginx:alpine
    container_name: ai-agent-web
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-80}:80"
    volumes:
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./web/dist:/usr/share/nginx/html:ro
    depends_on:
      - api

volumes:
  postgres_data:
  minio_data:
