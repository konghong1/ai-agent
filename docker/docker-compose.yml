name: ai-agent

services:
  # ──────────────────────────────────────────────────────────────
  # DATABASE: MySQL 8.0 (DEFAULT)
  # ──────────────────────────────────────────────────────────────
  # Switch to PostgreSQL by editing docker/.env:
  #   DATABASE_TYPE=postgresql
  #   Then comment out 'mysql' service below and uncomment 'postgres' below
  # ──────────────────────────────────────────────────────────────
  mysql:
    image: mysql:8.0
    container_name: ai-agent-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_secure_2026}
      MYSQL_DATABASE: ${MYSQL_DB:-ai_agent}
      MYSQL_USER: ${MYSQL_USER:-ai_agent}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-ai_agent_secure_2026}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      # init script switches based on DATABASE_TYPE
      - ./db/init_${DATABASE_TYPE:-mysql}.sql:/docker-entrypoint-initdb.d/01_init.sql:ro
    command: >
      --default-authentication-plugin=mysql_native_password
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
      --innodb-buffer-pool-size=256M
      --max-connections=200
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-root_secure_2026}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ──────────────────────────────────────────────────────────────
  # DATABASE: PostgreSQL 16 (ALTERNATIVE)
  # ──────────────────────────────────────────────────────────────
  # Uncomment below when DATABASE_TYPE=postgresql in docker/.env
  # ──────────────────────────────────────────────────────────────
  # postgres:
  #   image: postgres:16-alpine
  #   container_name: ai-agent-postgres
  #   restart: unless-stopped
  #   environment:
  #     POSTGRES_USER: ${POSTGRES_USER:-ai_agent}
  #     POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ai_agent_secure_2026}
  #     POSTGRES_DB: ${POSTGRES_DB:-ai_agent}
  #   ports:
  #     - "5432:5432"
  #   volumes:
  #     - postgres_data:/var/lib/postgresql/data
  #     - ./db/init_postgresql.sql:/docker-entrypoint-initdb.d/01_init.sql:ro
  #   healthcheck:
  #     test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ai_agent} -d ${POSTGRES_DB:-ai_agent}"]
  #     interval: 10s
  #     timeout: 5s
  #     retries: 5
  #     start_period: 10s

  # ──────────────────────────────────────────────────────────────
  # OBJECT STORAGE: MinIO (S3 Compatible)
  # ──────────────────────────────────────────────────────────────
  minio:
    image: minio/minio:latest
    container_name: ai-agent-minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minioadmin}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ──────────────────────────────────────────────────────────────
  # INIT MinIO BUCKET (runs once at startup)
  # ──────────────────────────────────────────────────────────────
  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin;
      mc mb local/ai-agent-minio --ignore-existing;
      mc anonymous set public local/ai-agent-minio;
      mc ilm import local/ai-agent-minio <<'EOF' || true
      {
        "Rules": [
          {"ID":"expire-videos","Status":"Enabled","Filter":{"Prefix":"videos/"},"Expiration":{"Days":30}},
          {"ID":"expire-images","Status":"Enabled","Filter":{"Prefix":"images/"},"Expiration":{"Days":180}},
          {"ID":"expire-avatars","Status":"Enabled","Filter":{"Prefix":"avatars/"},"Expiration":{"Days":365}},
          {"ID":"expire-thumbnails","Status":"Enabled","Filter":{"Prefix":"thumbnails/"},"Expiration":{"Days":30}},
          {"ID":"expire-temp","Status":"Enabled","Filter":{"Prefix":"temp/"},"Expiration":{"Days":7}}
        ]
      }
      EOF
      exit 0;
      "

  # ──────────────────────────────────────────────────────────────
  # BACKEND API: FastAPI + SQLAlchemy
  # ──────────────────────────────────────────────────────────────
  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile.api
    container_name: ai-agent-api
    restart: unless-stopped
    ports:
      - "${API_PORT:-8010}:8010"
    environment:
      # ── Database (dynamic based on DATABASE_TYPE) ──
      DATABASE_URL: ${DATABASE_URL}
      DATABASE_TYPE: ${DATABASE_TYPE:-mysql}

      # ── Storage (MinIO) ──
      STORAGE_BACKEND: ${STORAGE_BACKEND:-minio}
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-minioadmin}
      MINIO_BUCKET: ${MINIO_BUCKET:-ai-agent-minio}
      MINIO_PUBLIC_URL: ${MINIO_PUBLIC_URL:-http://localhost:9000/ai-agent-minio}
      MINIO_USE_SSL: "false"

      # ── Agnes AI API ──
      AGNES_API_KEY: ${AGNES_API_KEY:-sk-0T1BpcsI51cKxXgWZejpvONrcUs8vDc1Tqzz7NkObIWAyezd}
      AGNES_BASE_URL: ${AGNES_BASE_URL:-https://apihub.agnes-ai.com/v1}

      # ── App ──
      SECRET_KEY: ${SECRET_KEY:-change-me-in-production}
      DEBUG: "true"
      CORS_ORIGINS: "${CORS_ORIGINS:-http://localhost:5173,http://localhost:3000}"

      # ── Init ──
      INIT_DB_ON_STARTUP: "true"
    depends_on:
      mysql:
        condition: service_healthy
      # postgres:
      #   condition: service_healthy
      minio:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    volumes:
      - ../:/app
    command:
      - sh
      - -c
      - |
        python -m app.db.init_db
        python -m app.storage.ilm || true
        exec uvicorn app.server:app --host 0.0.0.0 --port 8010 --reload

  # ──────────────────────────────────────────────────────────────
  # BACKGROUND WORKER: Async media downloader
  # ──────────────────────────────────────────────────────────────
  worker:
    build:
      context: ..
      dockerfile: docker/Dockerfile.api
    container_name: ai-agent-worker
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL}
      DATABASE_TYPE: ${DATABASE_TYPE:-mysql}
      STORAGE_BACKEND: ${STORAGE_BACKEND:-minio}
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-minioadmin}
      MINIO_BUCKET: ${MINIO_BUCKET:-ai-agent-minio}
      MINIO_PUBLIC_URL: ${MINIO_PUBLIC_URL:-http://localhost:9000/ai-agent-minio}
      MINIO_USE_SSL: "false"
      AGNES_API_KEY: ${AGNES_API_KEY:-sk-0T1BpcsI51cKxXgWZejpvONrcUs8vDc1Tqzz7NkObIWAyezd}
      AGNES_BASE_URL: ${AGNES_BASE_URL:-https://apihub.agnes-ai.com/v1}
      SECRET_KEY: ${SECRET_KEY:-change-me-in-production}
    depends_on:
      mysql:
        condition: service_healthy
      # postgres:
      #   condition: service_healthy
      minio:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    volumes:
      - ../:/app
    command: python -m app.worker.media_worker

  # ──────────────────────────────────────────────────────────────
  # FRONTEND: Nginx serves static React app
  # ──────────────────────────────────────────────────────────────
  web:
    image: nginx:alpine
    container_name: ai-agent-web
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-80}:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ../web/dist:/usr/share/nginx/html:ro
    depends_on:
      - api

volumes:
  mysql_data:
  # postgres_data:  # uncomment when using postgres
  minio_data:
