<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" fill="none">
  <!-- 3D 投影 -->
  <defs>
    <linearGradient id="bodyGrad" x1="12" y1="4" x2="36" y2="44" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#60a5fa"/>
      <stop offset="0.5" stop-color="#3b82f6"/>
      <stop offset="1" stop-color="#7c3aed"/>
    </linearGradient>
    <linearGradient id="innerGrad" x1="24" y1="12" x2="24" y2="36" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="rgba(255,255,255,0.35)"/>
      <stop offset="1" stop-color="rgba(255,255,255,0.05)"/>
    </linearGradient>
    <radialGradient id="glow" cx="24" cy="16" r="18" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="rgba(96,165,250,0.55)"/>
      <stop offset="1" stop-color="rgba(96,165,250,0)"/>
    </radialGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#3b82f6" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- 外层发光 -->
  <circle cx="24" cy="24" r="18" fill="url(#glow)" opacity="0.8"/>

  <!-- 字母 A 外框（3D 玻璃质感） -->
  <path
    d="M24 6 L40 40 H8 L24 6 Z"
    fill="url(#bodyGrad)"
    filter="url(#softShadow)"
    opacity="0.95"
  />
  <path
    d="M24 6 L40 40 H8 L24 6 Z"
    fill="url(#innerGrad)"
  />

  <!-- 内部镂空三角形（让 A 更像图标） -->
  <path
    d="M24 18 L30 32 H18 L24 18 Z"
    fill="rgba(15,23,42,0.35)"
  />

  <!-- 神经网络节点与连线（科技感） -->
  <g stroke="rgba(255,255,255,0.85)" stroke-width="1.2" stroke-linecap="round">
    <line x1="24" y1="12" x2="16" y2="28"/>
    <line x1="24" y1="12" x2="32" y2="28"/>
    <line x1="16" y1="28" x2="32" y2="28"/>
    <line x1="20" y1="20" x2="28" y2="20"/>
  </g>
  <circle cx="24" cy="12" r="2" fill="#fff"/>
  <circle cx="16" cy="28" r="2" fill="#fff"/>
  <circle cx="32" cy="28" r="2" fill="#fff"/>
  <circle cx="20" cy="20" r="1.5" fill="#a78bfa"/>
  <circle cx="28" cy="20" r="1.5" fill="#a78bfa"/>

  <!-- 3D 高光 -->
  <path
    d="M24 6 L32 24 C30 20, 26 18, 24 18 C22 18, 18 20, 16 24 L24 6 Z"
    fill="rgba(255,255,255,0.18)"
  />

  <!-- 悬浮金属球（增强 3D 感） -->
  <circle cx="38" cy="10" r="3.5" fill="url(#bodyGrad)" opacity="0.9"/>
  <circle cx="38" cy="10" r="3.5" fill="rgba(255,255,255,0.25)"/>
  <circle cx="36.5" cy="8.5" r="1.2" fill="white" opacity="0.8"/>
</svg>
