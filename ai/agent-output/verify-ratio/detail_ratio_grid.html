<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Detail Ratio Grid Verification</title>
  <link rel="stylesheet" href="../../../web/dist/assets/index-CrWnP4HM.css" />
  <style>
    body { font-family: sans-serif; background: #f5f5f5; padding: 40px; }
  </style>
</head>
<body>
  <div class="gallery-page">
    <div class="g-modal detail-modal" style="display:block; position:static; transform:none; max-width:1080px; margin:0 auto;">
      <div class="detail-modal-body">
        <div class="detail-grid">
          <div class="detail-item">
            <div class="detail-img" style="aspect-ratio: 1 / 1;">
              <div style="width:100%;height:100%;display:grid;place-items:center;background:linear-gradient(135deg,#ffe2b3,#ffcc80);color:#8a6d3b;">1:1</div>
            </div>
            <div class="detail-title">白底主图 - 核心款全景展示</div>
            <div class="detail-meta"><span>类型：产品白底图</span></div>
          </div>
          <div class="detail-item">
            <div class="detail-img" style="aspect-ratio: 3 / 4;">
              <div style="width:100%;height:100%;display:grid;place-items:center;background:linear-gradient(135deg,#c2e9fb,#a1c4fd);color:#2a4d69;">3:4</div>
            </div>
            <div class="detail-title">细节材质图 - 蕾丝皮料拼接特写</div>
            <div class="detail-meta"><span>类型：细节特写</span></div>
          </div>
          <div class="detail-item">
            <div class="detail-img" style="aspect-ratio: 9 / 16;">
              <div style="width:100%;height:100%;display:grid;place-items:center;background:linear-gradient(135deg,#ffd1dc,#ff9a9e);color:#6b3a3f;">9:16</div>
            </div>
            <div class="detail-title">场景氛围图 - 晚宴约会场景上身展示</div>
            <div class="detail-meta"><span>类型：试穿试戴场景</span></div>
          </div>
          <div class="detail-item">
            <div class="detail-img" style="aspect-ratio: 16 / 9;">
              <div style="width:100%;height:100%;display:grid;place-items:center;background:linear-gradient(135deg,#d4fc79,#96e6a1);color:#2f5a36;">16:9</div>
            </div>
            <div class="detail-title">功能卖点图 - 核心设计卖点标注</div>
            <div class="detail-meta"><span>类型：核心卖点图</span></div>
          </div>
          <div class="detail-item">
            <div class="detail-img" style="aspect-ratio: 4 / 5;">
              <div style="width:100%;height:100%;display:grid;place-items:center;background:linear-gradient(135deg,#e0c3fc,#8ec5fc);color:#3a2d5c;">4:5</div>
            </div>
            <div class="detail-title">ThisIsAVeryLongEnglishTitleWithoutSpacesThatShouldWrapCorrectly</div>
            <div class="detail-meta"><span>类型：产品多角度</span></div>
          </div>
          <div class="detail-item">
            <div class="detail-img" style="aspect-ratio: 2 / 3;">
              <div style="width:100%;height:100%;display:grid;place-items:center;background:linear-gradient(135deg,#fbc2eb,#a6c1ee);color:#4a3b5c;">2:3</div>
            </div>
            <div class="detail-title">通用买家秀</div>
            <div class="detail-meta"><span>类型：通用买家秀</span></div>
          </div>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
